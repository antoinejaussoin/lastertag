[package]
name = "ir-sender"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
] }
# Pico 2 W: RP2350. No Wi-Fi crate; this sandbox only blinks an IR LED.
embassy-rp = { version = "0.10.0", features = [
    "rp235xa",
    "time-driver",
    "critical-section-impl",
    "binary-info",
] }
embassy-time = "0.5.1"
embedded-graphics = "0.8.1"
oled-i2c = { version = "0.3.0", features = ["embedded-graphics"] }
panic-halt = "1.0.0"
portable-atomic = { version = "1.11.0", features = ["critical-section"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
debug = true
