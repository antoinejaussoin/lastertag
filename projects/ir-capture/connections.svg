<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-label="IR capture connections: OLED and TSOP on the right side of the Pico 2 W">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 26px system-ui, sans-serif; fill: #101828; }
      .sub { font: 14px system-ui, sans-serif; fill: #344054; }
      .head { font: 700 16px system-ui, sans-serif; fill: #101828; }
      .text { font: 13px system-ui, sans-serif; fill: #101828; }
      .small { font: 12px system-ui, sans-serif; fill: #475467; }
      .mono { font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #101828; }
      .white { font: 700 12px system-ui, sans-serif; fill: #ffffff; }
      .pico { fill: #175cd3; stroke: #0b4ea2; stroke-width: 2; }
      .usb { fill: #98a2b3; stroke: #344054; stroke-width: 1.5; }
      .oled { fill: #101828; stroke: #000; stroke-width: 2; }
      .glass { fill: #0d0d0d; }
      .ot { font: 700 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #f5f5f5; }
      .tsop { fill: #1d2939; stroke: #000; stroke-width: 1.6; }
      .lens { fill: #667085; stroke: #101828; stroke-width: 1.2; }
      .pin { fill: #e4e7ec; stroke: #344054; stroke-width: 1; }
      .pin-use { fill: #fef0c7; stroke: #b54708; stroke-width: 1.4; }
      .pin-bad { fill: #fda29b; stroke: #b42318; stroke-width: 1.4; }
      .part { fill: none; stroke: #7a2e0e; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .ely { fill: #fef3f2; stroke: #b42318; stroke-width: 1.4; }
      .dot { fill: #101828; }
      .dot-red { fill: #d92d20; }
      .w { fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
      .red { stroke: #d92d20; }
      .blk { stroke: #101828; }
      .blu { stroke: #1570ef; }
      .grn { stroke: #12b76a; }
      .org { stroke: #dc6803; }
      .card { fill: #f8fafc; stroke: #667085; stroke-width: 1.6; }
    </style>
  </defs>

  <rect class="bg" width="1100" height="720"/>
  <text class="title" x="36" y="36">IR capture - connections</text>
  <text class="sub" x="36" y="58">Everything on the right side of the Pico. OLED pins are unchanged from temperature-display. 3.3 V only - never VBUS.</text>

  <rect class="usb" x="198" y="78" width="100" height="28" rx="4"/>
  <text class="mono" x="226" y="97">USB</text>
  <rect class="pico" x="180" y="106" width="136" height="310" rx="8"/>
  <text class="white" x="206" y="132">Pico 2 W</text>
  <circle cx="248" cy="158" r="9" fill="#f2f4f7" stroke="#0b4ea2" stroke-width="2"/>
  <text class="white" x="218" y="188">BOOTSEL</text>
  <text class="white" x="216" y="396">antenna</text>

  <rect class="pin-bad" x="316" y="118" width="22" height="14"/>
  <text class="mono" x="344" y="129">40 VBUS  leave empty</text>
  <rect class="pin-use" x="316" y="154" width="22" height="14"/>
  <text class="mono" x="344" y="165">38 GND</text>
  <rect class="pin-use" x="316" y="190" width="22" height="14"/>
  <text class="mono" x="344" y="201">36 3V3</text>
  <rect class="pin-use" x="316" y="300" width="22" height="14"/>
  <text class="mono" x="344" y="311">24 GP18  IR</text>
  <rect class="pin-use" x="316" y="336" width="22" height="14"/>
  <text class="mono" x="344" y="347">22 GP17  SCL</text>
  <rect class="pin-use" x="316" y="372" width="22" height="14"/>
  <text class="mono" x="344" y="383">21 GP16  SDA</text>

  <rect class="oled" x="820" y="86" width="200" height="118" rx="8"/>
  <rect class="glass" x="832" y="96" width="176" height="68" rx="4"/>
  <text class="ot" x="882" y="138">ready</text>
  <g transform="translate(844,212)">
    <rect class="pin-use" x="0" y="0" width="14" height="16"/>
    <rect class="pin-use" x="48" y="0" width="14" height="16"/>
    <rect class="pin-use" x="96" y="0" width="14" height="16"/>
    <rect class="pin-use" x="144" y="0" width="14" height="16"/>
  </g>
  <text class="mono" x="838" y="246">VCC</text>
  <text class="mono" x="886" y="246">GND</text>
  <text class="mono" x="934" y="246">SCL</text>
  <text class="mono" x="982" y="246">SDA</text>
  <text class="small" x="820" y="266">OLED - same four wires as temperature-display</text>

  <rect class="tsop" x="820" y="300" width="200" height="64" rx="8"/>
  <ellipse class="lens" cx="920" cy="322" rx="26" ry="12"/>
  <text class="white" x="868" y="350">TSOP38238</text>
  <g transform="translate(848,364)">
    <rect class="pin-use" x="0" y="0" width="14" height="16"/>
    <rect class="pin-use" x="56" y="0" width="14" height="16"/>
    <rect class="pin-use" x="112" y="0" width="14" height="16"/>
  </g>
  <text class="mono" x="842" y="398">OUT</text>
  <text class="mono" x="898" y="398">GND</text>
  <text class="mono" x="954" y="398">VS</text>
  <text class="small" x="820" y="416">lens toward you, legs down: OUT GND VS</text>

  <path class="part" d="M560 198 h10 l6-8 10 16 10-16 10 16 6-8 h10"/>
  <text class="mono" x="588" y="186">100 ohm</text>
  <path class="part" d="M700 230 v14 M692 244 h16 M692 250 h16 M700 250 v14"/>
  <text class="mono" x="722" y="252">100 nF</text>
  <rect class="ely" x="676" y="276" width="48" height="16" rx="7"/>
  <text class="mono" x="680" y="288">+</text>
  <rect x="712" y="276" width="6" height="16" fill="#344054"/>
  <text class="mono" x="724" y="288">4.7 uF</text>

  <circle class="dot" cx="500" cy="161" r="4"/>
  <circle class="dot-red" cx="500" cy="197" r="4"/>
  <circle class="dot-red" cx="700" cy="197" r="4"/>
  <circle class="dot" cx="700" cy="161" r="4"/>

  <path class="w blk" d="M338 161 H500"/>
  <path class="w red" d="M338 197 H560"/>
  <path class="w red" d="M632 198 H700"/>
  <path class="w blk" d="M500 161 H700"/>
  <path class="w red" d="M700 197 H851 V220"/>
  <path class="w blk" d="M700 161 H899 V220"/>
  <path class="w blu" d="M338 343 H947 V228"/>
  <path class="w grn" d="M338 379 H995 V228"/>
  <path class="w org" d="M338 307 H855 V364"/>
  <path class="w blk" d="M700 161 V364 H911"/>
  <path class="w red" d="M700 197 V364 H967"/>
  <path class="w red" d="M700 197 V244"/>
  <path class="w blk" d="M700 264 V276 H676"/>
  <path class="w blk" d="M718 284 H740 V161"/>

  <rect class="card" x="36" y="450" width="1028" height="246" rx="10"/>
  <text class="head" x="56" y="480">Wires</text>
  <text class="mono" x="56" y="508" style="fill:#d92d20">red      3V3 pin 36   -&gt;  OLED VCC</text>
  <text class="mono" x="56" y="530" style="fill:#d92d20">red      3V3 pin 36   -&gt;  100 ohm  -&gt;  TSOP VS</text>
  <text class="mono" x="56" y="552">black    GND pin 38   -&gt;  OLED GND, TSOP GND, both capacitors</text>
  <text class="mono" x="56" y="574" style="fill:#1570ef">blue     GP17 pin 22  -&gt;  OLED SCL</text>
  <text class="mono" x="56" y="596" style="fill:#12b76a">green    GP16 pin 21  -&gt;  OLED SDA</text>
  <text class="mono" x="56" y="618" style="fill:#dc6803">orange   GP18 pin 24  -&gt;  TSOP OUT</text>
  <text class="text" x="56" y="650">100 nF and 4.7 uF go across TSOP VS and GND. 4.7 uF stripe / minus to GND. 100 ohm and 100 nF have no polarity.</text>
  <text class="text" x="56" y="672">GP18 is on the same right-hand edge as the screen, two pins above GP17 (there is a GND between them).</text>
</svg>
