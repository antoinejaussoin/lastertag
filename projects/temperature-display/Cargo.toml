[package]
name = "temperature-display"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
cyw43 = "0.7.0"
cyw43-pio = "0.10.0"
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [
    "tcp",
    "dhcpv4",
    "dns",
    "proto-ipv4",
    "medium-ethernet",
] }
# Pico 2 W: RP2350 (`rp235xa`) plus onboard CYW43439.
embassy-rp = { version = "0.10.0", features = [
    "rp235xa",
    "time-driver",
    "critical-section-impl",
    "binary-info",
] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embedded-graphics = "0.8.1"
embedded-io-async = "0.7.0"
heapless = "0.8.0"
oled-i2c = { version = "0.3.0", features = ["embedded-graphics"] }
panic-halt = "1.0.0"
portable-atomic = { version = "1.11.0", features = ["critical-section"] }
static_cell = "2.1.1"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
debug = true
