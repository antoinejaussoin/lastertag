<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1680" viewBox="0 0 1200 1680" role="img" aria-label="Identification chart for resistors, capacitors, IR parts, transistor and button from the shopping list">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px system-ui, sans-serif; fill: #101828; }
      .sub { font: 14px system-ui, sans-serif; fill: #344054; }
      .head { font: 700 17px system-ui, sans-serif; fill: #101828; }
      .text { font: 13.5px system-ui, sans-serif; fill: #101828; }
      .small { font: 12px system-ui, sans-serif; fill: #475467; }
      .tiny { font: 11px system-ui, sans-serif; fill: #344054; }
      .mono { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #101828; }
      .white { font: 700 13px system-ui, sans-serif; fill: #ffffff; }
      .card { fill: #f8fafc; stroke: #d0d5dd; stroke-width: 1.6; }
      .warn { fill: #fffaeb; stroke: #dc6803; stroke-width: 1.6; }
      .lead { stroke: #98a2b3; stroke-width: 3; stroke-linecap: round; }
      .led { fill: #d0d5dd; stroke: #344054; stroke-width: 1.5; }
      .lens { fill: #98a2b3; stroke: #101828; stroke-width: 1.2; }
      .tsop { fill: #1d2939; stroke: #000; stroke-width: 1.4; }
      .to92 { fill: #1d2939; stroke: #101828; stroke-width: 1.3; }
      .cer { fill: #f5d0a9; stroke: #b54708; stroke-width: 1.4; }
      .ely { fill: #1d2939; stroke: #101828; stroke-width: 1.3; }
      .stripe { fill: #d0d5dd; }
      .btn { fill: #f2f4f7; stroke: #344054; stroke-width: 1.5; }
      .pin-use { fill: #fef0c7; stroke: #b54708; stroke-width: 1.2; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="1680"/>
  <text class="title" x="40" y="42">Parts you bought — how to recognise them</text>
  <text class="sub" x="40" y="66">Match the colour bands and printed names. Gold on a resistor is 5% tolerance; brown at the far end of the 15 Ω part is 1%.</text>

  <!-- ========== RESISTORS ========== -->
  <rect class="card" x="28" y="88" width="1144" height="560" rx="12"/>
  <text class="head" x="48" y="118">Resistors — read bands from the end opposite the gold (or last brown) band</text>
  <text class="small" x="48" y="140">The 100 Ω / 220 Ω / 10 kΩ packs are small beige 0.25 W carbon-film. The 15 Ω parts are fatter 1 W metal-film, often a green body.</text>

  <!-- 100 ohm -->
  <text class="mono" x="64" y="178">100 Ω</text>
  <text class="small" x="64" y="196">0.25 W pack · Rapid 62-0346</text>
  <line class="lead" x1="64" y1="230" x2="288" y2="230"/>
    <rect x="92" y="212.0" width="168" height="36" rx="8" fill="#e8d5b7" stroke="#7a4a28" stroke-width="1.4"/>
    <rect x="108" y="215.0" width="8" height="30" fill="#7a4a28"/>
    <rect x="120" y="215.0" width="8" height="30" fill="#1d2939"/>
    <rect x="132" y="215.0" width="8" height="30" fill="#7a4a28"/>
    <rect x="154" y="215.0" width="8" height="30" fill="#c7a008"/>
  <text class="tiny" x="64" y="268">brown · black · brown · gold</text>
  <text class="tiny" x="64" y="286">1  0  ×10  ±5%</text>
  <text class="text" x="64" y="312">TSOP supply filter (one per receiver).</text>

  <!-- 220 ohm -->
  <text class="mono" x="360" y="178">220 Ω</text>
  <text class="small" x="360" y="196">0.25 W pack · Rapid 62-0354</text>
  <line class="lead" x1="360" y1="230" x2="584" y2="230"/>
    <rect x="388" y="212.0" width="168" height="36" rx="8" fill="#e8d5b7" stroke="#7a4a28" stroke-width="1.4"/>
    <rect x="404" y="215.0" width="8" height="30" fill="#d92d20"/>
    <rect x="416" y="215.0" width="8" height="30" fill="#d92d20"/>
    <rect x="428" y="215.0" width="8" height="30" fill="#7a4a28"/>
    <rect x="450" y="215.0" width="8" height="30" fill="#c7a008"/>
  <text class="tiny" x="360" y="268">red · red · brown · gold</text>
  <text class="tiny" x="360" y="286">2  2  ×10  ±5%</text>
  <text class="text" x="360" y="312">GP18 to transistor base. Never a 15 Ω here.</text>

  <!-- 10k -->
  <text class="mono" x="656" y="178">10 kΩ</text>
  <text class="small" x="656" y="196">0.25 W pack · Rapid 62-0394</text>
  <line class="lead" x1="656" y1="230" x2="880" y2="230"/>
    <rect x="684" y="212.0" width="168" height="36" rx="8" fill="#e8d5b7" stroke="#7a4a28" stroke-width="1.4"/>
    <rect x="700" y="215.0" width="8" height="30" fill="#7a4a28"/>
    <rect x="712" y="215.0" width="8" height="30" fill="#1d2939"/>
    <rect x="724" y="215.0" width="8" height="30" fill="#f79009"/>
    <rect x="746" y="215.0" width="8" height="30" fill="#c7a008"/>
  <text class="tiny" x="656" y="268">brown · black · orange · gold</text>
  <text class="tiny" x="656" y="286">1  0  ×1 k  ±5%</text>
  <text class="text" x="656" y="312">Base pull-down and button inputs.</text>

  <!-- 15 ohm 1W 5-band -->
  <text class="mono" x="64" y="360">15 Ω  1 W</text>
  <text class="small" x="64" y="378">fatter green body · Rapid 62-8705</text>
  <line class="lead" x1="64" y1="418" x2="320" y2="418"/>
    <rect x="92" y="396.0" width="200" height="44" rx="10" fill="#86e8ab" stroke="#7a4a28" stroke-width="1.4"/>
    <rect x="108" y="399.0" width="9" height="38" fill="#7a4a28"/>
    <rect x="121" y="399.0" width="9" height="38" fill="#12b76a"/>
    <rect x="134" y="399.0" width="9" height="38" fill="#1d2939"/>
    <rect x="147" y="399.0" width="9" height="38" fill="#c7a008"/>
    <rect x="170" y="399.0" width="9" height="38" fill="#7a4a28"/>
  <text class="tiny" x="64" y="460">brown · green · black · gold · brown</text>
  <text class="tiny" x="64" y="478">1  5  0  ×0.1  ±1%   →  15 Ω</text>
  <text class="text" x="64" y="504">Two in series on the IR LED (3.3 V only).</text>

  <rect class="warn" x="520" y="348" width="628" height="168" rx="8"/>
  <text class="head" x="540" y="376">Easy mix-up</text>
  <text class="text" x="540" y="400">100 Ω and 10 kΩ both start brown-black. The third band decides it:</text>
  <text class="mono" x="540" y="426">100 Ω    third band brown</text>
  <text class="mono" x="540" y="448">10 kΩ    third band orange</text>
  <text class="text" x="540" y="476">15 Ω is the only green, fat one. Do not put it on a GPIO.</text>
  <text class="text" x="540" y="498">If a 15 Ω has only four bands, it is brown-green-black-gold.</text>

  <text class="small" x="48" y="548">Band colours (digits 0–9, then multiplier, then tolerance):</text>
  <rect x="48" y="560" width="18" height="18" rx="3" fill="#1d2939" stroke="#344054" stroke-width="0.8"/><text class="tiny" x="72" y="573">0  ×1</text>
  <rect x="148" y="560" width="18" height="18" rx="3" fill="#7a4a28" stroke="#344054" stroke-width="0.8"/><text class="tiny" x="172" y="573">1  ×10  ±1%</text>
  <rect x="288" y="560" width="18" height="18" rx="3" fill="#d92d20" stroke="#344054" stroke-width="0.8"/><text class="tiny" x="312" y="573">2  ×100  ±2%</text>
  <rect x="428" y="560" width="18" height="18" rx="3" fill="#f79009" stroke="#344054" stroke-width="0.8"/><text class="tiny" x="452" y="573">3  ×1 k</text>
  <rect x="548" y="560" width="18" height="18" rx="3" fill="#fac515" stroke="#344054" stroke-width="0.8"/><text class="tiny" x="572" y="573">4  ×10 k</text>
  <rect x="668" y="560" width="18" height="18" rx="3" fill="#12b76a" stroke="#344054" stroke-width="0.8"/><text class="tiny" x="692" y="573">5</text>
  <rect x="748" y="560" width="18" height="18" rx="3" fill="#1570ef" stroke="#344054" stroke-width="0.8"/><text class="tiny" x="772" y="573">6</text>
  <rect x="828" y="560" width="18" height="18" rx="3" fill="#7a5af8" stroke="#344054" stroke-width="0.8"/><text class="tiny" x="852" y="573">7</text>
  <rect x="908" y="560" width="18" height="18" rx="3" fill="#667085" stroke="#344054" stroke-width="0.8"/><text class="tiny" x="932" y="573">8</text>
  <rect x="988" y="560" width="18" height="18" rx="3" fill="#f2f4f7" stroke="#344054" stroke-width="0.8"/><text class="tiny" x="1012" y="573">9</text>
  <rect x="48" y="608" width="18" height="18" rx="3" fill="#c7a008" stroke="#344054" stroke-width="0.8"/><text class="tiny" x="72" y="621">×0.1  ±5%</text>
  <rect x="188" y="608" width="18" height="18" rx="3" fill="#98a2b3" stroke="#344054" stroke-width="0.8"/><text class="tiny" x="212" y="621">×0.01  ±10%</text>

  <!-- ========== CAPACITORS ========== -->
  <rect class="card" x="28" y="668" width="564" height="360" rx="12"/>
  <text class="head" x="48" y="698">Capacitors</text>

  <text class="mono" x="48" y="728">100 nF ceramic</text>
  <text class="small" x="48" y="746">Suntan · Rapid 11-3442 · no polarity</text>
  <rect class="cer" x="90" y="770" width="70" height="52" rx="10"/>
  <text class="mono" x="108" y="802">104</text>
  <line class="lead" x1="108" y1="822" x2="108" y2="868"/>
  <line class="lead" x1="142" y1="822" x2="142" y2="868"/>
  <text class="text" x="180" y="792">Small beige/yellow blob. Printed</text>
  <text class="mono" x="180" y="814">104</text>
  <text class="text" x="220" y="814">= 10 × 10⁴ pF = 100 nF.</text>
  <text class="text" x="180" y="836">Either way round. TSOP / IR decoupling.</text>
  <text class="text" x="180" y="858">Lead pitch 2.54 mm (breadboard).</text>

  <text class="mono" x="48" y="900">4.7 µF electrolytic</text>
  <text class="small" x="48" y="918">JB · Rapid 11-4117 · polarised</text>
  <rect class="ely" x="92" y="932" width="48" height="62" rx="6"/>
  <rect class="stripe" x="92" y="932" width="14" height="62" rx="3"/>
  <text class="tiny" x="94" y="966" style="fill:#1d2939">−</text>
  <line class="lead" x1="132" y1="994" x2="132" y2="1024"/>
  <line class="lead" x1="108" y1="994" x2="108" y2="1012"/>
  <text class="tiny" x="126" y="1020">+</text>
  <text class="tiny" x="98" y="1020">−</text>
  <text class="text" x="180" y="952">Black or dark can, about 4 × 7 mm.</text>
  <text class="text" x="180" y="974">Stripe on the can is minus (−).</text>
  <text class="text" x="180" y="996">Longer lead is plus (+).</text>
  <text class="text" x="180" y="1018">Wrong way round can damage it.</text>

  <!-- ========== SEMICONDUCTORS ========== -->
  <rect class="card" x="608" y="668" width="564" height="360" rx="12"/>
  <text class="head" x="628" y="698">Diodes and IR</text>

  <text class="mono" x="628" y="728">TSAL6200  IR LED</text>
  <text class="small" x="628" y="746">Vishay 940 nm · Rapid 49-4513</text>
  <ellipse class="led" cx="678" cy="800" rx="22" ry="18"/>
  <ellipse class="lens" cx="704" cy="800" rx="9" ry="14"/>
  <line class="lead" x1="666" y1="818" x2="666" y2="872"/>
  <line class="lead" x1="690" y1="818" x2="690" y2="852"/>
  <text class="tiny" x="648" y="886">long = A</text>
  <text class="tiny" x="682" y="866">K</text>
  <text class="text" x="730" y="786">Clear or smoke-grey 5 mm LED.</text>
  <text class="text" x="730" y="808">Long lead = anode (A).</text>
  <text class="text" x="730" y="830">Short lead + flat rim = cathode (K).</text>
  <text class="text" x="730" y="852">Invisible to the eye; not a laser.</text>

  <text class="mono" x="628" y="910">TSOP38238  IR receiver</text>
  <text class="small" x="628" y="928">Vishay 38 kHz · Pi Hut</text>
  <path class="tsop" d="M900 948 h70 v46 h-70 z"/>
  <ellipse cx="952" cy="971" rx="14" ry="16" fill="#667085" stroke="#101828" stroke-width="1.2"/>
  <line class="lead" x1="914" y1="994" x2="914" y2="1018"/>
  <line class="lead" x1="935" y1="994" x2="935" y2="1018"/>
  <line class="lead" x1="956" y1="994" x2="956" y2="1018"/>
  <text class="text" x="628" y="968">Black 3-pin, lens toward you:</text>
  <text class="mono" x="628" y="990">OUT  GND  VS</text>
  <text class="text" x="628" y="1012">left to right. VS is not 5 V.</text>

  <!-- ========== TRANSISTOR + BUTTON ========== -->
  <rect class="card" x="28" y="1048" width="564" height="300" rx="12"/>
  <text class="head" x="48" y="1078">Transistor</text>
  <text class="mono" x="48" y="1104">BC337-40</text>
  <text class="small" x="48" y="1122">Diotec NPN · Rapid 50-3113 · TO-92</text>
  <path class="to92" d="M80 1155 h108 v50 h-108 z"/>
  <text class="white" x="96" y="1186">C   B   E</text>
  <line class="lead" x1="98" y1="1205" x2="98" y2="1248"/>
  <line class="lead" x1="134" y1="1205" x2="134" y2="1248"/>
  <line class="lead" x1="170" y1="1205" x2="170" y2="1248"/>
  <text class="tiny" x="90" y="1264">C</text>
  <text class="tiny" x="126" y="1264">B</text>
  <text class="tiny" x="162" y="1264">E</text>
  <text class="text" x="220" y="1168">Flat face toward you, legs down:</text>
  <text class="mono" x="220" y="1190">C collector   LED cathode</text>
  <text class="mono" x="220" y="1212">B base        220 Ω from GP18</text>
  <text class="mono" x="220" y="1234">E emitter     GND</text>
  <text class="text" x="220" y="1260">Not the same order as a 2N2222.</text>
  <text class="small" x="48" y="1324">Bag of 50; you only need a few. Same part as the player gun driver.</text>

  <rect class="card" x="608" y="1048" width="564" height="300" rx="12"/>
  <text class="head" x="628" y="1078">Button</text>
  <text class="mono" x="628" y="1104">DTS-644K  tactile</text>
  <text class="small" x="628" y="1122">Diptronics 6 × 6 mm · Rapid 78-1150</text>
  <rect class="btn" x="660" y="1150" width="88" height="88" rx="10"/>
  <circle cx="704" cy="1194" r="16" fill="#344054"/>
  <line class="lead" x1="676" y1="1150" x2="676" y2="1134"/>
  <line class="lead" x1="732" y1="1150" x2="732" y2="1134"/>
  <line class="lead" x1="676" y1="1238" x2="676" y2="1254"/>
  <line class="lead" x1="732" y1="1238" x2="732" y2="1254"/>
  <text class="text" x="780" y="1172">Four legs. The 6.5 mm pair (the ones</text>
  <text class="text" x="780" y="1194">that span a breadboard trench) are</text>
  <text class="text" x="780" y="1216">already joined. Press joins the 4.5 mm</text>
  <text class="text" x="780" y="1238">pair — two columns on the same half.</text>
  <text class="text" x="780" y="1260">GPIO and GND both on the Pico side.</text>
  <text class="small" x="628" y="1324">Do not put GND on the far side of the trench. That shorts the GPIO at rest.</text>

  <!-- footer -->
  <text class="small" x="40" y="1388">Not drawn: Pico 2 W, PiCowbell, LiPo, OLED, breadboards, jumper kit, USB cables — those have printed names on the part.</text>
  <text class="small" x="40" y="1410">Shopping list: docs/shopping-list.md. Hole-by-hole wiring lives in each project folder’s wiring.svg.</text>

  <rect class="warn" x="28" y="1432" width="1144" height="216" rx="12"/>
  <text class="head" x="48" y="1464">What each one is for</text>
  <text class="text" x="48" y="1492">IR shot  ·  3.3 V → two 15 Ω → TSAL6200 anode · cathode → BC337 collector · GP18 → 220 Ω → base · 10 kΩ base to GND</text>
  <text class="text" x="48" y="1516">IR hit   ·  3.3 V → 100 Ω → TSOP VS · 100 nF and 4.7 µF from VS to GND · OUT to a GPIO</text>
  <text class="text" x="48" y="1540">OLED     ·  3.3 V, GND, SCL, SDA — never VBUS (5 V)</text>
  <text class="text" x="48" y="1564">Button   ·  GPIO (internal pull-up) to one side, other side to GND</text>
  <text class="text" x="48" y="1596">Ceramic = no polarity. Electrolytic = stripe/short lead is minus. LED long lead is plus. Transistor C-B-E with the flat toward you.</text>
  <text class="small" x="48" y="1624">Infrared only. Never substitute a laser diode. Never put 15 Ω on a Pico GPIO.</text>
</svg>
