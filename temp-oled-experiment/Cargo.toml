[package]
name = "temp-oled-experiment"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
] }
# Pico 2 W: RP2350 (`rp235xa`). Onboard CYW43439 Wi-Fi is unused in this crate.
embassy-rp = { version = "0.10.0", features = [
    "rp235xa",
    "time-driver",
    "critical-section-impl",
    "binary-info",
] }
embassy-time = "0.5.1"
embedded-graphics = "0.8.1"
heapless = "0.8.0"
oled-i2c = { version = "0.3.0", features = ["embedded-graphics"] }
panic-halt = "1.0.0"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
debug = true
